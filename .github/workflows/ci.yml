name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  terraform-fmt:
    name: Terraform fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Validate Terraform roots
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t tf_dirs < <(find . -type f -name '*.tf' -not -path '*/.terraform/*' -printf '%h\n' | sort -u)
          if [ "${#tf_dirs[@]}" -eq 0 ]; then
            echo "No Terraform files found; skipping validate."
            exit 0
          fi

          roots=()
          for dir in "${tf_dirs[@]}"; do
            if grep -REq '^\s*(terraform\s*\{|provider\s+"[^"]+"\s*\{)' --include='*.tf' "$dir"; then
              roots+=("$dir")
            fi
          done

          if [ "${#roots[@]}" -eq 0 ]; then
            echo "No Terraform root directories detected; skipping validate."
            exit 0
          fi

          for root in "${roots[@]}"; do
            echo "::group::terraform validate ${root}"
            (
              cd "$root"
              terraform init -backend=false -input=false -no-color >/dev/null
              terraform validate -no-color
            )
            echo "::endgroup::"
          done

  python-checks:
    name: Python lint + compile + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.8'

      - name: Install Ruff
        run: python -m pip install ruff==0.6.9

      - name: Ruff lint
        run: ruff check .

      - name: Python compileall
        run: python -m compileall .

      - name: Run pytest when tests are present
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
            python -m pip install pytest==8.3.3
            python -m pytest -q
          else
            echo "No pytest tests found; skipping pytest."
          fi
